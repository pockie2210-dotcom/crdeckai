<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elite Deck Helper - Clash Royale</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="card_compare.css">
</head>

<body>
  <!-- LOADING OVERLAY -->
  <div id="loadingOverlay"
    style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; flex-direction:column; align-items:center; justify-content:center;">
    <div class="loader"></div>
    <div id="loadingText" style="color:var(--gold); margin-top:15px; font-weight:bold;">Initializing...</div>
  </div>

  <div class="container">
    <header style="text-align:center; margin-bottom:30px;">
      <h1 style="color:var(--gold); font-size:2.5em; margin-bottom:5px;">ELITE DECK HELPER</h1>
      <p style="color:#888;">Ultimate Champion Analysis & Strategy</p>
    </header>

    <!-- SEARCH & SCAN SECTION -->
    <div
      style="background:rgba(20,20,25,0.7); padding:20px; border-radius:12px; border:1px solid #333; margin-bottom:20px;">
      <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
        <input type="text" id="tagInput" placeholder="Enter Player Tag (e.g. #2PP)"
          style="padding:12px; border-radius:8px; border:1px solid #444; background:#000; color:#fff; width:280px;">
        <button id="scanBtn" onclick="window.scanPlayerFromInput()" class="action-btn"
          style="background:var(--gold); color:#000;">Scan Player</button>
      </div>
    </div>

    <!-- MAIN DASHBOARD RENDERING -->
    <div id="deckContainer"
      style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center; min-height:120px; margin-bottom:20px;">
      <div style="color:#444; font-style:italic;">Scan a player to begin...</div>
    </div>

    <!-- CORE ACTION DASHBOARD -->
    <div class="action-grid">
      <button id="matchupBtn" onclick="window.MatchupController.open()" class="pro-btn">
        <div class="pro-btn-icon">⚔️</div>
        <div class="pro-btn-text">
          <span class="pro-btn-title">Matchup Analyzer</span>
          <span class="pro-btn-sub">Counter any deck</span>
        </div>
      </button>

      <button id="eliteBtn" onclick="window.EliteDiagnosis.open()" class="pro-btn elite">
        <div class="pro-btn-icon">👑</div>
        <div class="pro-btn-text">
          <span class="pro-btn-title">Elite Diagnosis</span>
          <span class="pro-btn-sub">Radar & Weakness Analysis</span>
        </div>
      </button>

      <button id="winConGuideBtn" class="pro-btn">
        <div class="pro-btn-icon">🎓</div>
        <div class="pro-btn-text">
          <span class="pro-btn-title">Masterclass</span>
          <span class="pro-btn-sub">Win Condition Guides</span>
        </div>
      </button>

      <button id="liveMetaBtn" onclick="window.fetchLiveMeta()" class="pro-btn">
        <div class="pro-btn-icon">🔥</div>
        <div class="pro-btn-text">
          <span class="pro-btn-title">Live Meta</span>
          <span class="pro-btn-sub">Top Decks Snapshot</span>
        </div>
      </button>

      <button id="compareBtn" onclick="window.CardCompare.open()" class="pro-btn compare">
        <div class="pro-btn-icon">📊</div>
        <div class="pro-btn-text">
          <span class="pro-btn-title">Card Comparer</span>
          <span class="pro-btn-sub">1v1 Win Predictor</span>
        </div>
      </button>
    </div>

  </div>

  <!-- MODALS -->
  <div id="matchupModal" class="modal">
    <div class="modal-content" style="max-width:900px; background:#1a1a1d;">
      <span class="close" onclick="document.getElementById('matchupModal').style.display='none'">&times;</span>
      <h2>Matchup Analysis</h2>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
        <div>
          <h3>Your Deck</h3>
          <div id="myDeckPreview" class="deck-grid"></div>
        </div>
        <div>
          <h3>Enemy Deck</h3>
          <div id="enemyDeckWrapper" class="deck-grid"></div>
          <button id="clearEnemyBtn" onclick="window.MatchupController.clearEnemy()">Clear</button>
        </div>
      </div>
      <div id="enemyCardPicker" class="picker-grid" style="margin-top:20px; max-height:200px; overflow-y:auto;"></div>
      <button id="analyzeBtn" class="action-btn" style="margin-top:20px; width:100%;">⚖️ ANALYZE NOW</button>
      <div id="analysisResult" style="margin-top:15px; display:none;"></div>
    </div>
  </div>

  <div id="premiumModal" class="modal">
    <div class="modal-content" style="max-width:800px; background:#111; border:2px solid var(--gold);">
      <span class="close" onclick="document.getElementById('premiumModal').style.display='none'">&times;</span>
      <h2 class="modal-title" style="color:var(--gold); text-align:center; text-transform:uppercase; letter-spacing:2px;">Premium Analysis</h2>
      <div id="premiumBody"></div>
    </div>
  </div>

  <div id="winConditionModal" class="modal">
    <div class="modal-content" style="max-width:1000px; max-height:85vh; overflow-y:auto; margin:5% auto;">
      <span class="close" onclick="document.getElementById('winConditionModal').style.display='none'">&times;</span>
      <h2>Win Condition Strategies</h2>
      <div id="guideList">
        <div style="display:flex; gap:10px; justify-content:center; margin-bottom:15px;">
          <button id="primaryWinConBtn" onclick="renderWinConGrid('primary')" class="action-btn"
            style="background:var(--gold); color:#000; font-weight:900;">⚔️ Primary Win Cons</button>
          <button id="secondaryWinConBtn" onclick="renderWinConGrid('secondary')" class="action-btn"
            style="background:#555; color:#ccc;">🛡️ Secondary / Support</button>
        </div>
        <div id="winConditionGrid" class="win-con-grid"></div>
      </div>
      <div id="guideDetail" style="display:none;">
        <button
          onclick="document.getElementById('guideDetail').style.display='none'; document.getElementById('guideList').style.display='block';">Back</button>
        <div id="guideDetailContent"></div>
      </div>
    </div>
  </div>

  <!-- CORE SCRIPTS -->
  <script src="win_conditions.js"></script>
  <script src="meta_decks.js"></script>
  <script src="smart_engine_v11.js"></script>
  <script src="deckshop_helper.js"></script>
  <script src="card_stats.js"></script>
  <script src="card_compare.js"></script>

  <script>
    /**
     * UNIFIED CORE ENGINE v3.0
     */
    window.builderDeck = [];
    window.allCards = [];

    function normalizeLevel(card) {
      if (!card) return 1;
      return 14 - ((card.maxLevel || 14) - (card.level || 1));
    }
    const getProxyImage = (url, name) => (url && url.startsWith('http')) ? `/api/proxy-image?src=${encodeURIComponent(url)}&name=${encodeURIComponent(name || '')}` : url;

    // --- DECK ANALYSIS & RADAR ---
    window.DeckWeakness = {
      analyze: function (deck) {
        if (!deck || deck.length === 0) return { scores: { offense: 0, defense: 0, cycle: 0, air: 0, synergy: 0 }, reasons: {} };

        let offense = 40, defense = 40, cycle = 50, air = 40, synergy = 40;
        let reasons = { offense: [], defense: [], cycle: [], air: [], synergy: [] };
        let totalElixir = 0;

        const WIN_CONS = ['Hog Rider', 'Ram Rider', 'Battle Ram', 'Wall Breakers', 'Elixir Golem', 'Giant', 'Royal Giant', 'Goblin Giant', 'Electro Giant', 'Golem', 'Lava Hound', 'Balloon', 'Skeleton Barrel', 'Goblin Barrel', 'Miner', 'Graveyard', 'Goblin Drill', 'X-Bow', 'Mortar', 'Three Musketeers', 'Sparky'];
        const SMALL_SPELLS = ['Zap', 'The Log', 'Giant Snowball', 'Arrows', 'Rage', 'Barbarian Barrel', 'Tornado'];
        const BIG_SPELLS = ['Fireball', 'Poison', 'Rocket', 'Lightning', 'Earthquake', 'Void', 'Freeze', 'Clone', 'Mirror'];
        const DEFENSE_TROOPS = ['Knight', 'Valkyrie', 'Skeleton Army', 'Guards', 'Ice Golem', 'Mini P.E.K.K.A', 'Prince', 'Bandit', 'Ghost', 'Goblin Gang', 'Bowler', 'Executioner', 'Lumberjack', 'Mega Knight', 'Mighty Miner', 'Monk', 'Skeleton King', 'Golden Knight', 'Little Prince', 'Dart Goblin'];
        const AIR_TROOPS = ['Musketeer', 'Wizard', 'Archer', 'Minion', 'Dragon', 'Witch', 'Hunter', 'Firecracker', 'Tesla', 'Inferno', 'Bats', 'Dart Goblin', 'Spear Goblins', 'Flying Machine', 'Phoenix', 'Queen'];

        deck.forEach(c => {
          if (!c) return;
          totalElixir += c.elixirCost || 0;
          if (WIN_CONS.includes(c.name)) {
            offense += 20;
            reasons.offense.push(c.name);
          }
          if (c.type === 'Building' || ['Tesla', 'Cannon', 'Inferno'].some(n => c.name.includes(n)) || DEFENSE_TROOPS.some(n => c.name.includes(n))) {
            defense += 15;
            reasons.defense.push(c.name);
          }
          if (AIR_TROOPS.some(k => c.name.includes(k))) {
            air += 15;
            reasons.air.push(c.name);
          }
        });

        if (window.SmartAI && window.SmartAI.SYNERGIES) {
          synergy = 30; // base level
          let addedSyns = [];
          for (let i = 0; i < deck.length; i++) {
            for (let j = i + 1; j < deck.length; j++) {
              if (!deck[i] || !deck[j]) continue;
              const n1 = deck[i].name.replace(/ Evolution$/i, '');
              const n2 = deck[j].name.replace(/ Evolution$/i, '');
              const pair1 = `${n1}+${n2}`;
              const pair2 = `${n2}+${n1}`;
              const synLevel = window.SmartAI.SYNERGIES[pair1] || window.SmartAI.SYNERGIES[pair2] || 0;
              if (synLevel > 0) {
                synergy += (synLevel * 10);
                addedSyns.push(`${n1} + ${n2}`);
              }
            }
          }
          if (addedSyns.length > 0) reasons.synergy = [...new Set(addedSyns)];
          else reasons.synergy.push("No major strong synergies.");
        }

        const avgElixir = totalElixir / 8;
        cycle = Math.max(0, Math.min(100, (5.0 - avgElixir) * 30 + 10));
        reasons.cycle.push(`${avgElixir.toFixed(1)} Avg Elixir`);

        const clamp = (n) => Math.max(10, Math.min(100, n));
        return {
          scores: { offense: clamp(offense), defense: clamp(defense), cycle: clamp(cycle), air: clamp(air), synergy: clamp(synergy) },
          reasons: reasons,
          avgElixir: avgElixir
        };
      },
      analyzeFlaws: function (deck) {
        const flaws = [];
        const WIN_CONS = ['Hog Rider', 'Ram Rider', 'Battle Ram', 'Wall Breakers', 'Elixir Golem', 'Giant', 'Royal Giant', 'Goblin Giant', 'Electro Giant', 'Golem', 'Lava Hound', 'Balloon', 'Skeleton Barrel', 'Goblin Barrel', 'Miner', 'Graveyard', 'Goblin Drill', 'X-Bow', 'Mortar', 'Three Musketeers', 'Sparky'];
        const SMALL_SPELLS = ['Zap', 'The Log', 'Giant Snowball', 'Arrows', 'Rage', 'Barbarian Barrel', 'Tornado'];
        const BIG_SPELLS = ['Fireball', 'Poison', 'Rocket', 'Lightning', 'Earthquake', 'Void', 'Freeze', 'Clone', 'Mirror'];
        const winCons = deck.filter(c => c && WIN_CONS.includes(c.name));
        const spells = deck.filter(c => c && (SMALL_SPELLS.includes(c.name) || BIG_SPELLS.includes(c.name)));
        const avgCost = deck.reduce((sum, c) => sum + (c ? (c.elixirCost || 0) : 0), 0) / 8;
        if (winCons.length === 0) flaws.push("NO WIN CONDITION: You cannot win reliably.");
        if (spells.length < 2) flaws.push("NOT ENOUGH SPELLS: Minimum 2 spells required.");
        if (avgCost > 4.5) flaws.push("TOO EXPENSIVE: Cycle is too slow.");
        return flaws;
      }
    };

    // --- SYNERGY MATRIX ---
    window.SynergyMatrix = {
      render: function (deck) {
        const body = document.getElementById('synergyBody');
        const modal = document.getElementById('synergyMatrixModal');
        if (!body || !modal) return;

        modal.style.display = 'flex';
        const titleEl = modal.querySelector('.modal-title');
        if (titleEl) titleEl.innerText = "🔗 Synergy Matrix";

        let html = '<div style="padding:10px; overflow-x:auto;">';
        html += '<table style="width:100%; border-collapse:collapse; color:#fff; font-size:10px;">';

        // Header Row
        html += '<tr><th></th>';
        deck.forEach(c => {
          const icon = getProxyImage(c.iconUrls?.medium || c.iconUrl, c.name);
          html += `<th><img src="${icon}" style="width:25px;"></th>`;
        });
        html += '</tr>';

        // Rows
        deck.forEach(rowCard => {
          const rowIcon = getProxyImage(rowCard.iconUrls?.medium || rowCard.iconUrl, rowCard.name);
          html += `<tr><td style="text-align:right;"><img src="${rowIcon}" style="width:25px;"></td>`;
          deck.forEach(colCard => {
            if (rowCard.name === colCard.name) {
              html += `<td style="background:#334; text-align:center; padding:8px;">-</td>`;
            } else {
              let score = 50; // base score
              let desc = "Neutral synergy";

              if (window.SmartAI && window.SmartAI.SYNERGIES) {
                const match = window.SmartAI.SYNERGIES.find(s =>
                  s.cards.includes(rowCard.name) && s.cards.includes(colCard.name)
                );
                if (match) {
                  if (match.tier === 'S' || match.tier === 'A') score = 95;
                  else score = 80;
                  desc = match.desc || "Known Synergy";
                }
              }

              // Negative synergy for redundancy (e.g., two win conditions)
              if (window.SmartAI && window.SmartAI.ROLES) {
                const r1 = Object.keys(window.SmartAI.ROLES).filter(k => window.SmartAI.ROLES[k].includes(rowCard.name));
                const r2 = Object.keys(window.SmartAI.ROLES).filter(k => window.SmartAI.ROLES[k].includes(colCard.name));
                const intersection = r1.filter(v => r2.includes(v));
                // If both are win conditions or both are big spells, penalize
                if (intersection.includes('winCon') || intersection.includes('spellBig') || intersection.includes('building')) {
                  score = 30; // Redundant role penalty
                  desc = "Redundant Roles";
                }
              }

              const color = score > 85 ? '#2ecc71' : (score > 70 ? '#f1c40f' : (score < 40 ? '#e74c3c' : '#888'));
              html += `<td style="background:${color}30; color:${color}; text-align:center; border:1px solid #333; padding:8px;" title="${desc}">${score}%</td>`;
            }
          });
          html += '</tr>';
        });

        html += '</table>';
        html += '</div>';
        body.innerHTML = html;
      }
    };

    // --- MATCHUP CONTROLLER V2 ---
    window.MatchupController = {
      enemyDeck: [],
      activeTarget: 'enemy',
      open: function () {
        document.getElementById('matchupModal').style.display = 'flex';
        this.renderMyDeck();
        this.renderEnemyDeck();
        this.renderPicker();
      },
      renderMyDeck: function () {
        const container = document.getElementById('myDeckPreview');
        const deck = window.builderDeck || [];
        container.innerHTML = '';
        container.style.display = 'grid';
        container.style.gridTemplateColumns = 'repeat(4, 1fr)';
        container.style.gap = '8px';

        for (let i = 0; i < 8; i++) {
          const c = deck[i];
          const div = document.createElement('div');
          div.className = 'mini-card-slot' + (c ? '' : ' empty');
          
          if (c) {
            const isEvo = c.evolutionLevel > 0 || c.name.toLowerCase().includes("evolution");
            const isHero = c.rarity === 'champion' || c.rarity === 'Champion';
            const imgSrc = getProxyImage((isEvo && c.iconUrls?.evolutionMedium) ? c.iconUrls.evolutionMedium : (c.iconUrls?.medium || c.iconUrl), c.name);
            
            div.innerHTML = `
              <img src="${imgSrc}" style="width:100%; height:100%; object-fit:cover;">
              <div class="mini-card-remove" onclick="window.builderDeck.splice(${i},1); window.MatchupController.renderMyDeck();">&times;</div>
            `;
            if (isHero) div.style.border = '1px solid var(--gold)';
            else if (isEvo) div.style.border = '1px solid #d456fd';
          } else {
            div.innerHTML = '+';
          }
          container.appendChild(div);
        }
      },
      renderEnemyDeck: function () {
        const container = document.getElementById('enemyDeckWrapper');
        container.innerHTML = '';
        container.style.display = 'grid';
        container.style.gridTemplateColumns = 'repeat(4, 1fr)';
        container.style.gap = '8px';

        for (let i = 0; i < 8; i++) {
          const c = this.enemyDeck[i];
          const div = document.createElement('div');
          div.className = 'mini-card-slot enemy' + (c ? '' : ' empty');

          if (c) {
            const isEvo = c.evolutionLevel > 0 || c.name.toLowerCase().includes("evolution");
            const isHero = c.rarity === 'champion' || c.rarity === 'Champion';
            const imgSrc = getProxyImage((isEvo && c.iconUrls?.evolutionMedium) ? c.iconUrls.evolutionMedium : (c.iconUrls?.medium || c.iconUrl), c.name);

            div.innerHTML = `
              <img src="${imgSrc}" style="width:100%; height:100%; object-fit:cover;">
              <div class="mini-card-remove" onclick="window.MatchupController.enemyDeck.splice(${i},1); window.MatchupController.renderEnemyDeck();">&times;</div>
            `;
            if (isHero) div.style.border = '1px solid var(--gold)';
            else if (isEvo) div.style.border = '1px solid #d456fd';
          } else {
            div.innerHTML = '+';
          }
          container.appendChild(div);
        }
      },
      renderPicker: async function () {
        const picker = document.getElementById('enemyCardPicker');
        if (!window.allCards || window.allCards.length === 0) {
          const res = await fetch('/api/cards');
          window.allCards = await res.json();
        }
        picker.innerHTML = window.allCards.map(c => `
          <img src="${getProxyImage(c.iconUrls?.medium || c.iconUrl, c.name)}" 
               style="width:40px; cursor:pointer; margin:2px;" 
               title="${c.name}"
               onclick="window.MatchupController.addCard('${c.name}')">`).join('');
      },
      addCard: function (name) {
        const card = window.allCards.find(c => c.name === name);
        if (this.activeTarget === 'enemy' && this.enemyDeck.length < 8) {
          if (!this.enemyDeck.find(x => x.name === name)) this.enemyDeck.push(card);
        } else if (window.builderDeck.length < 8) {
          if (!window.builderDeck.find(x => x.name === name)) window.builderDeck.push(card);
        }
        this.renderMyDeck();
        this.renderEnemyDeck();
      },
      clearEnemy: function () { this.enemyDeck = []; this.renderEnemyDeck(); },
      analyze: async function () {
        const myDeck = window.builderDeck || [];
        const enemyDeck = this.enemyDeck;
        if (myDeck.length < 8 || enemyDeck.length < 8) return alert("Fill both decks! Ensure all 8 slots are populated.");

        // Dynamically import or reference the real MatchupAnalyzer
        let report;
        if (window.MatchupAnalyzer) {
          report = window.MatchupAnalyzer.analyzeMatchup(myDeck, enemyDeck);
        } else {
          const mModule = await import('./matchup_analyzer.js');
          window.MatchupAnalyzer = mModule.MatchupAnalyzer;
          report = window.MatchupAnalyzer.analyzeMatchup(myDeck, enemyDeck);
        }

        const resultArea = document.getElementById('analysisResult');
        resultArea.style.display = 'block';

        let color = '#2ecc71';
        if (report.winProbability < 50) color = '#e74c3c';
        else if (report.winProbability === 50) color = '#f1c40f';

        resultArea.innerHTML = `
          <div style="background:#222; padding:20px; border-radius:12px; border:2px solid ${color}; text-align:center;">
            <div style="font-size:14px; color:#888; text-transform:uppercase; letter-spacing:1px;">${report.advantageText}</div>
            <div style="font-size:42px; font-weight:900; color:${color}; margin:10px 0;">${report.winProbability}% OUTCOME</div>
            
            <div style="margin-top:15px; display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; text-align:left;">
              <div style="font-size:12px; background:rgba(255,255,255,0.05); padding:10px; border-radius:8px;">
                <div style="color:var(--gold); font-weight:bold; margin-bottom:5px;">🕒 1X ELIXIR</div>
                <div style="color:#ddd; line-height:1.4;">${report.gameplan.singleElixir}</div>
              </div>
              <div style="font-size:12px; background:rgba(255,255,255,0.05); padding:10px; border-radius:8px;">
                <div style="color:var(--gold); font-weight:bold; margin-bottom:5px;">🕒 2X ELIXIR</div>
                <div style="color:#ddd; line-height:1.4;">${report.gameplan.doubleElixir}</div>
              </div>
              <div style="font-size:12px; background:rgba(255,255,255,0.05); padding:10px; border-radius:8px;">
                <div style="color:var(--gold); font-weight:bold; margin-bottom:5px;">💀 SUDDEN DEATH</div>
                <div style="color:#ddd; line-height:1.4;">${report.gameplan.suddenDeath || 'Execute final pushes relentlessly.'}</div>
              </div>
            </div>

            ${report.tips.length > 0 ? `
            <div style="margin-top:15px; padding:10px; background:rgba(0,0,0,0.5); border-radius:8px; text-align:left;">
              <strong style="color:var(--gold);">🔥 Key Tactical Edge:</strong>
              <ul style="margin:5px 0 0 20px; color:#ccc; font-size:13px;">
                ${report.tips.map(t => `<li>${t}</li>`).join('')}
              </ul>
            </div>` : ''}
          </div>
        `;
      }
    };

    // Attach analyze handler
    const analyzeBtn = document.getElementById('analyzeBtn');
    if (analyzeBtn) analyzeBtn.onclick = () => window.MatchupController.analyze();

    // --- ELITE PRO DIAGNOSIS ---
    window.EliteDiagnosis = {
      open: function () {
        const deck = window.builderDeck;
        if (!deck || deck.length < 8) return alert("Fill deck first!");
        document.getElementById('eliteDiagnosisModal').style.display = 'flex';
        this.analyze(deck);
      },
      close: function () {
        document.getElementById('eliteDiagnosisModal').style.display = 'none';
      },
      analyze: function (deck) {
        this.updateGauges(deck);
        this.simulateMatchups(deck);
        this.findEliteFix(deck);
        this.renderTacticalBriefing(deck);
      },
      updateGauges: function (deck) {
        const flaws = window.DeckWeakness ? window.DeckWeakness.analyzeFlaws(deck) : [];
        const metaScore = Math.max(0, 100 - (flaws.length * 15));
        const metaEl = document.getElementById('eliteMetaScore');
        if (metaEl) {
          metaEl.innerText = metaScore + '%';
          metaEl.className = 'gauge-value ' + (metaScore > 75 ? 'val-pro' : (metaScore > 50 ? 'val-med' : 'val-hot'));
        }

        let totalSynScore = 0;
        let pairs = 0;
        for (let i = 0; i < deck.length; i++) {
          for (let j = i + 1; j < deck.length; j++) {
            let score = 50;
            if (window.SmartAI && window.SmartAI.SYNERGIES) {
              const match = window.SmartAI.SYNERGIES.find(s => s.cards.includes(deck[i].name) && s.cards.includes(deck[j].name));
              if (match) score = (match.tier === 'S' || match.tier === 'A') ? 95 : 80;
            }
            totalSynScore += score;
            pairs++;
          }
        }
        const synScore = pairs > 0 ? Math.round(totalSynScore / pairs) : 50;

        const synEl = document.getElementById('eliteSynergy');
        if (synEl) {
          synEl.innerText = synScore + '%';
          synEl.className = 'gauge-value ' + (synScore > 75 ? 'val-pro' : (synScore > 50 ? 'val-med' : 'val-hot'));
        }

        const avg = deck.reduce((s, c) => s + (c.elixirCost || 0), 0) / (deck.length || 1);

              </h4>
              <ul style="margin:0; padding-left:20px; font-size:12px; color:#ccc; line-height:1.6;">
                ${flaws.length > 0 ? flaws.map(f => `<li>${f}</li>`).join('') : `
                  <li>Structural integrity is stable for this archetype.</li>
                  <li>${scores.offense > 75 ? 'Focus on punish plays when opponent is low on elixir.' : 'Focus on precise defense and counter-pushing.'}</li>
                `}
              </ul>
            </div>

          </div>
        `;
        body.innerHTML = html;
      }
    };

    // --- STRATEGY GUIDES (Delegated Listener) ---
    document.addEventListener('click', function (e) {
      if (e.target.id === 'winConGuideBtn' || e.target.closest('#winConGuideBtn')) {
        const modal = document.getElementById('winConditionModal');
        if (!modal) return;
        modal.style.display = 'flex';
        renderWinConGrid();
      }
    });

    function renderWinConGrid(mode) {
      mode = mode || 'primary';
      const grid = document.getElementById('winConditionGrid');
      if (!grid) return;

      const primaryBtn = document.getElementById('primaryWinConBtn');
      const secondaryBtn = document.getElementById('secondaryWinConBtn');
      if (primaryBtn && secondaryBtn) {
        if (mode === 'primary') {
          primaryBtn.style.background = 'var(--gold)'; primaryBtn.style.color = '#000';
          secondaryBtn.style.background = '#555'; secondaryBtn.style.color = '#ccc';
        } else {
          secondaryBtn.style.background = 'var(--gold)'; secondaryBtn.style.color = '#000';
          primaryBtn.style.background = '#555'; primaryBtn.style.color = '#ccc';
        }
      }

      const source = mode === 'primary' ? window.WIN_CONDITION_GUIDES : window.SECONDARY_WIN_CONDITION_GUIDES;
      if (!source) { grid.innerHTML = '<div style="color:#888; text-align:center;">No data available.</div>'; return; }

      grid.innerHTML = Object.keys(source).map(key => {
        const isPrimary = !!window.WIN_CONDITION_GUIDES[key];
        const borderColor = isPrimary ? '#f39c12' : '#7b3fe4';
        return `
        <div class="win-con-card" onclick="showGuideDetail('${key}')" style="position:relative; cursor:pointer; border-radius:8px; overflow:hidden; transition:transform 0.2s, box-shadow 0.2s; border:2px solid ${borderColor}; background:#111; aspect-ratio:0.8;">
          <img src="${getProxyImage(source[key].imgUrl, key)}" style="width:100%; height:100%; object-fit:cover; display:block;" onerror="this.src='https://placehold.co/100?text=${key}'">
          <div style="position:absolute; bottom:0; width:100%; background:rgba(0,0,0,0.85); color:#fff; font-size:11px; padding:5px 4px; text-align:center; font-weight:bold; pointer-events:none;">${key}</div>
          <div style="position:absolute; top:4px; right:4px; background:${isPrimary ? 'rgba(243,156,18,0.9)' : 'rgba(123,63,228,0.9)'}; color:#fff; font-size:8px; font-weight:900; padding:2px 5px; border-radius:4px; pointer-events:none;">${isPrimary ? 'PRIMARY' : 'SUPPORT'}</div>
        </div>
      `;
      }).join('');
    }

    function showGuideDetail(key) {
      const list = document.getElementById('guideList');
      const detail = document.getElementById('guideDetail');
      const content = document.getElementById('guideDetailContent');
      const guide = window.WIN_CONDITION_GUIDES[key] || window.SECONDARY_WIN_CONDITION_GUIDES[key];
      if (!guide) return;

      list.style.display = 'none';
      detail.style.display = 'block';

      let html = `
        <div style="display:flex; align-items:center; gap:20px; margin-bottom:20px; border-bottom:1px solid #333; padding-bottom:15px;">
          <img src="${getProxyImage(guide.imgUrl, guide.title)}" style="width:80px; border-radius:8px; border:2px solid var(--gold);">
          <div>
            <h2 style="color:var(--gold); margin:0;">${key} Masterclass</h2>
            <div style="color:#888; font-size:12px; margin-top:4px;">${guide.role} • ${guide.archetype} • Difficulty: ${guide.difficulty}</div>
          </div>
        </div>
        
        <p style="color:#ddd; font-style:italic; margin-bottom:20px;">"${guide.description}"</p>

        <h3 style="color:#fff; font-size:16px; margin-bottom:15px; border-left:4px solid var(--gold); padding-left:10px;">Required Deck Components</h3>
        <div id="roleGrid" class="role-grid-container" style="display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; margin-bottom:20px; max-width:400px; margin-left:auto; margin-right:auto;">
          ${guide.composition.map((comp, i) => `
            <div class="role-card" onclick="showRoleDescription(${i}, '${key}')" 
                 style="background:${comp.color}; width:80px; height:100px; border-radius:10px; border:3px solid #000; display:flex; align-items:center; justify-content:center; font-family:'Arial Black', sans-serif; font-size:24px; color:white; text-shadow:2px 2px 0 #000; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,0.5); transition:transform 0.1s;">
              ${comp.abbr}
            </div>
          `).join('')}
        </div>

        <div id="roleDetailArea" style="background:rgba(0,0,0,0.4); border:1px solid var(--gold); border-radius:12px; padding:15px; min-height:100px; margin-bottom:20px; transition:all 0.3s;">
          <div style="color:#888; font-style:italic; text-align:center;">Click a component block to see detail...</div>
        </div>

        <h3 style="color:#fff; font-size:16px; margin-bottom:10px; border-left:4px solid var(--gold); padding-left:10px;">Execution Strategy</h3>
        <ul style="color:#ccc; font-size:13px; line-height:1.6; padding-left:20px; margin:0;">
          ${guide.strategy.map(step => `<li>${step}</li>`).join('')}
        </ul>
      `;
      content.innerHTML = html;
    }

    window.showRoleDescription = function (index, key) {
      const guide = window.WIN_CONDITION_GUIDES[key] || window.SECONDARY_WIN_CONDITION_GUIDES[key];
      const comp = guide.composition[index];
      const area = document.getElementById('roleDetailArea');
      if (!area || !comp) return;

      area.style.display = 'block';
      area.innerHTML = `
        <div style="color:${comp.color}; font-weight:900; font-size:14px; text-transform:uppercase; margin-bottom:8px;">${comp.role} (${comp.abbr})</div>
        <div style="color:#fff; font-size:13px; margin-bottom:10px; color:#ddd;">${comp.reason}</div>
        <div style="font-size:11px; color:#888;"><b>Recommended:</b> ${comp.examples.join(', ')}</div>
      `;

      // Highlight selected card
      // Highlight selected card
      document.querySelectorAll('.role-card').forEach((el, i) => {
        el.style.transform = i === index ? 'translateY(-5px) scale(1.05)' : 'none';
        el.style.borderColor = i === index ? '#fff' : '#000';
      });
    };

    window.fetchLiveMeta = async function () {
      const modal = document.getElementById('premiumModal');
      if (!modal) return;
      modal.style.display = 'flex';
      const title = modal.querySelector('.modal-title');
      if (title) title.innerText = "🔥 LIVE META SNAPSHOT";
      const body = document.getElementById('premiumBody');
      
      // Ensure vertical scrolling for many decks
      body.style.maxHeight = '70vh';
      body.style.overflowY = 'auto';
      body.style.padding = '10px';
      
      body.innerHTML = '<div style="text-align:center; padding:20px;"><div class="loader" style="margin:0 auto;"></div><div style="margin-top:10px; color:#888;">Fetching Top Decks...</div></div>';

      try {
        let meta = [];
        if (window.DeckShop && window.DeckShop.getTopDecks) {
          meta = await window.DeckShop.getTopDecks();
        } else {
          const getC = (n) => (window.allCards && window.allCards.find(c => c.name === n)) || { name: n, rarity: 'Common', iconUrl: `https://placehold.co/100x120?text=${n.replace(' ', '+')}` };
          meta = [
            { name: "Miner Poison Control", cards: [getC("Miner"), getC("Poison"), getC("Knight"), getC("Musketeer"), getC("Skeletons Evolution"), getC("Ice Spirit"), getC("The Log"), getC("Bomb Tower")] },
            { name: "Hog 2.6 Cycle", cards: [getC("Hog Rider"), getC("Musketeer"), getC("Ice Golem"), getC("Skeletons"), getC("Ice Spirit"), getC("The Log"), getC("Fireball"), getC("Cannon")] },
            { name: "Giant Graveyard", cards: [getC("Giant"), getC("Graveyard"), getC("Bowler"), getC("Musketeer"), getC("Bats Evolution"), getC("Arrows"), getC("Giant Snowball"), getC("Night Witch")] },
            { name: "LavaLoon Aerial", cards: [getC("Lava Hound"), getC("Balloon"), getC("Mega Minion"), getC("Guards"), getC("Skeleton Dragons"), getC("Inferno Dragon"), getC("Zap"), getC("Fireball")] },
            { name: "Mega Knight Spam", cards: [getC("Mega Knight"), getC("Ram Rider"), getC("Bandit"), getC("Ghost"), getC("Electro Wizard"), getC("Barbarian Barrel"), getC("Fireball"), getC("Ice Golem")] },
            { name: "Log Bait Classic", cards: [getC("Goblin Barrel"), getC("Princess"), getC("Knight"), getC("Goblin Gang"), getC("Inferno Tower"), getC("Rocket"), getC("The Log"), getC("Ice Spirit")] }
          ];
        }

        window.LAST_META_DECKS = meta; // Store for inspection

        body.innerHTML = '<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:15px; padding:5px;">' + meta.map((d, idx) => {
          let deckHtml = '<div style="background:#1a1a1d; border:1px solid #333; border-radius:12px; padding:15px; box-shadow:0 10px 30px rgba(0,0,0,0.5); display:flex; flex-direction:column; justify-content:space-between;">';
          deckHtml += `<div><div style="font-weight:900; color:var(--gold); font-size:13px; margin-bottom:10px; text-transform:uppercase; letter-spacing:1px; text-align:center;">${d.name || 'Pro Meta Deck'}</div>`;
          deckHtml += '<div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-bottom:15px;">';

          d.cards.forEach(c => {
            const isEvo = c.name && c.name.includes("Evolution");
            const isHero = c.rarity === "champion" || (['Giant', 'Musketeer', 'Mini P.E.K.K.A', 'Knight', 'Ice Golem', 'Wizard'].includes(c.name));
            let borderHTML = isHero ? `border: 2px solid var(--gold); box-shadow: 0 0 10px rgba(255,215,0,0.4);` : 
                             (isEvo ? `border: 2px solid #a855f7; box-shadow: 0 0 10px rgba(168,85,247,0.4);` : `border: 1px solid #444;`);
            
            let badgeHTML = isHero ? `<div style="position:absolute; bottom:-6px; left:50%; transform:translateX(-50%); background:linear-gradient(90deg, #d4af37, #f39c12); color:#000; font-size:8px; font-weight:900; padding:2px 6px; border-radius:4px; border:1px solid #fff; white-space:nowrap; z-index:2; text-shadow:0px 1px 1px rgba(255,255,255,0.5);">👑 HERO</div>` :
                            (isEvo ? `<div style="position:absolute; bottom:-6px; left:50%; transform:translateX(-50%); background:linear-gradient(90deg, #9333ea, #c084fc); color:#fff; font-size:8px; font-weight:900; padding:2px 6px; border-radius:4px; border:1px solid #fff; white-space:nowrap; z-index:2; text-shadow:0px 1px 2px rgba(0,0,0,0.8);">🟣 EVO</div>` : "");

            deckHtml += `
                 <div class="card-slot" style="position:relative; aspect-ratio:0.8; background:#222; border-radius:6px; overflow:visible; ${borderHTML}">
                   <img src="${getProxyImage(c.iconUrls?.medium || c.iconUrl, c.name)}" style="width:100%; height:100%; object-fit:cover; border-radius:4px; display:block;" onerror="this.src='https://placehold.co/100x120?text=Card'">
                   ${badgeHTML}
                 </div>
               `;
          });

          deckHtml += '</div></div>';
          deckHtml += `<button class="action-btn" onclick="window.inspectMetaDeck(${idx})" style="width:100%; font-size:11px; padding:10px; background:#2ecc71; color:#000; border:none; font-weight:900; border-radius:6px; transition:all 0.2s;">INSPECT & LOAD DECK</button>`;
          deckHtml += '</div>';
          return deckHtml;
        }).join('') + '</div>';
      } catch (e) {
        console.error(e);
        body.innerHTML = "Failed to load meta decks.";
      }
    };

    window.inspectMetaDeck = function(index) {
      const deckObj = window.LAST_META_DECKS[index];
      if (!deckObj) return;

      // Load into the main builder
      window.builderDeck = [...deckObj.cards];
      window.currentAppDeck = window.builderDeck;
      
      // Update UI
      if (window.renderScanResults) {
        window.renderScanResults({ currentDeck: window.builderDeck });
      } else if (window.SimpleDeckBuilder && window.SimpleDeckBuilder.renderSlots) {
        window.SimpleDeckBuilder.deck = window.builderDeck;
        window.SimpleDeckBuilder.renderSlots();
      }
      
      // Close modal
      document.getElementById('premiumModal').style.display = 'none';

      // Scroll to deck container
      const container = document.getElementById('deckContainer');
      if (container) container.scrollIntoView({ behavior: 'smooth' });
    };

    document.addEventListener('DOMContentLoaded', () => {
      console.log("Clash Royale Helper v3.0 Online.");
      if (window.SimpleDeckBuilder) window.SimpleDeckBuilder.init();
    });
  </script>
</body>

</html>
